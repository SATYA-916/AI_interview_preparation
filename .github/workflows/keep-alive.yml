name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://ai-interview-preparation-api-u4a0.onrender.com/health; then
              echo "Backend is awake"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 20
          done
          echo "Backend did not respond after retries"
